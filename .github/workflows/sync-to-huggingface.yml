# Mirrors this repo to a Hugging Face Space on every push (free: 2 vCPU / 16 GB RAM).
# One-time setup: see README → "Option B: Hugging Face Spaces".
name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}   # e.g. your-hf-username/latex-compiler
        run: |
          # Spaces need a small YAML header in README.md telling them to use the Dockerfile
          { printf -- '---\ntitle: LaTeX Compiler\nemoji: 📄\ncolorFrom: green\ncolorTo: gray\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n'; cat README.md; } > README.tmp
          mv README.tmp README.md
          rm -rf .git && git init -q -b main
          git config user.email "actions@github.com" && git config user.name "GitHub Actions"
          git add -A && git commit -q -m "Sync from GitHub ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
